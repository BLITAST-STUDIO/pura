<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ecebe6" />
    <script>
      // The page is light unless the player chose the dark page, or the screen is the original game / a lab.
      (function () {
        var q = location.search, dark = /[?&](play=classic|lab=)/.test(q) || /[?&]ui=dark/.test(q);
        try { if (!/[?&]ui=/.test(q) && localStorage.getItem("pura-flow-ui-v2") === "dark") dark = true; } catch (e) {}
        if (!dark) return;
        document.documentElement.classList.add("boot-dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#07080c");
      })();
    </script>
    <title>PURA</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>html,body{color:#1e2629;background:#ecebe6;width:100%;height:100%;margin:0;overflow:hidden}html.boot-dark,html.boot-dark body{color:#eceef2;background:#07080c}#root{width:100%;height:100%;min-height:360px}.boot{box-sizing:border-box;flex-direction:column;justify-content:center;height:100%;min-height:360px;padding:48px 24px;font-family:sans-serif;display:flex}.boot h1{color:#1e2629;margin:8px 0 0;font-size:64px;font-weight:600}.boot p{color:#6f7a7d;margin:0;font-size:13px}.boot .hint{color:#3f8f93;margin-top:28px;font-size:15px}html.boot-dark .boot h1{color:#eceef2}html.boot-dark .boot p{color:#8b90a0}html.boot-dark .boot .hint{color:#5ee4f2}#pura-err{color:#ff8a8a;z-index:99999;white-space:pre-wrap;background:#1a0e10;border:1px solid #5a2020;padding:12px 16px;font:13px/1.4 monospace;display:none;position:fixed;bottom:16px;left:16px;right:16px}</style>
    <script type="module" crossorigin src="./assets/index-BolelRSA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-Be0EfIst.css">
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p>LIQUID CORE</p>
        <h1>PURA</h1>
        <p class="hint">読み込み中…</p>
      </div>
    </div>
    <pre id="pura-err"></pre>
    <script>
      window.__puraIntent = window.__puraIntent || null;
      window.__puraGo = window.__puraGo || function (a) { window.__puraIntent = a; };
      function __puraFail(msg) {
        var el = document.getElementById("pura-err");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(msg || "load error");
      }
      window.addEventListener("error", function (e) {
        var m = e && e.message ? e.message : "";
        if (!m || /ResizeObserver/i.test(m)) return;
        __puraFail(m + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        __puraFail(e && e.reason ? e.reason : "promise error");
      });
    </script>
  </body>
</html>
