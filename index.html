<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ecebe6" />
    <script>
      // The page is light unless the player chose the dark page, or the screen is the original game / a lab.
      (function () {
        var q = location.search, dark = /[?&](play=classic|lab=)/.test(q) || /[?&]ui=dark/.test(q);
        try { if (!/[?&]ui=/.test(q) && localStorage.getItem("pura-flow-ui-v2") === "dark") dark = true; } catch (e) {}
        if (!dark) return;
        document.documentElement.classList.add("boot-dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#07080c");
      })();
    </script>
    <title>PURA</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>html,body{color:#1e2629;background:#ecebe6;width:100%;height:100%;margin:0;overflow:hidden}html.boot-dark,html.boot-dark body{color:#eceef2;background:#07080c}#root{width:100%;height:100%;min-height:360px}.boot{box-sizing:border-box;flex-direction:column;justify-content:center;align-items:center;gap:22px;height:100%;min-height:360px;padding:48px 24px;font-family:-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif;display:flex}.boot-mark{letter-spacing:.14em;color:#1e2629;align-items:center;gap:12px;margin:0;font-size:30px;font-weight:300;display:flex}.boot-mark i{border:1px solid #6b8f92;border-radius:60% 40% 55% 45%/65% 45% 55% 35%;width:19px;height:24px;display:block;transform:rotate(27deg)}.boot-mark b{color:#3f8f93;font-weight:300}.boot-line{background:linear-gradient(90deg,#0000,#6b8f92,#0000);width:120px;height:1px;animation:1.6s ease-in-out infinite boot-line}.boot-note{letter-spacing:.3em;color:#6f7a7d;margin:0;font-size:10px}@keyframes boot-line{0%,to{opacity:.2;transform:scaleX(.4)}50%{opacity:1;transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.boot-line{animation:none}}html.boot-dark .boot-mark{color:#eceef2}html.boot-dark .boot-mark i{border-color:#90b4b9}html.boot-dark .boot-mark b{color:#5ee4f2}html.boot-dark .boot-note{color:#8b90a0}#pura-err{color:#ff8a8a;z-index:99999;white-space:pre-wrap;background:#1a0e10;border:1px solid #5a2020;padding:12px 16px;font:13px/1.4 monospace;display:none;position:fixed;bottom:16px;left:16px;right:16px}</style>
    <script type="module" crossorigin src="./assets/index-BLzrfdJB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-BrwvRnNd.css">
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-mark"><i></i><span>PURA<b>.</b></span></p>
        <span class="boot-line" aria-hidden="true"></span>
        <p class="boot-note">読み込み中</p>
      </div>
    </div>
    <pre id="pura-err"></pre>
    <script>
      window.__puraIntent = window.__puraIntent || null;
      window.__puraGo = window.__puraGo || function (a) { window.__puraIntent = a; };
      function __puraFail(msg) {
        var el = document.getElementById("pura-err");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(msg || "load error");
      }
      window.addEventListener("error", function (e) {
        var m = e && e.message ? e.message : "";
        if (!m || /ResizeObserver/i.test(m)) return;
        __puraFail(m + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        __puraFail(e && e.reason ? e.reason : "promise error");
      });
    </script>
  </body>
</html>
