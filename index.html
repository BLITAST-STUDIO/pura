<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ecebe6" />
    <script>
      // The page is light unless the player chose the dark page, or the screen is the original game / a lab.
      (function () {
        var q = location.search, dark = /[?&](play=classic|lab=)/.test(q) || /[?&]ui=dark/.test(q);
        try { if (!/[?&]ui=/.test(q) && localStorage.getItem("pura-flow-ui-v2") === "dark") dark = true; } catch (e) {}
        if (!dark) return;
        document.documentElement.classList.add("boot-dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#07080c");
      })();
    </script>
    <title>PURA</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #ecebe6;
        color: #1e2629;
        overflow: hidden;
      }
      html.boot-dark, html.boot-dark body { background: #07080c; color: #eceef2; }
      #root {
        width: 100%;
        height: 100%;
        min-height: 360px;
      }
      /* The loading moment wears the app's mark: the drop outline and PURA. */
      .boot {
        min-height: 360px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 48px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        box-sizing: border-box;
      }
      .boot-mark { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 30px; font-weight: 300; letter-spacing: .14em; color: #1e2629; }
      .boot-mark i { display: block; width: 19px; height: 24px; border: 1px solid #6b8f92; border-radius: 60% 40% 55% 45% / 65% 45% 55% 35%; transform: rotate(27deg); }
      .boot-mark b { font-weight: 300; color: #3f8f93; }
      .boot-line { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, #6b8f92, transparent); animation: boot-line 1.6s ease-in-out infinite; }
      .boot-note { margin: 0; font-size: 10px; letter-spacing: .3em; color: #6f7a7d; }
      @keyframes boot-line { 0%, 100% { opacity: .2; transform: scaleX(.4); } 50% { opacity: 1; transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .boot-line { animation: none; } }
      html.boot-dark .boot-mark { color: #eceef2; }
      html.boot-dark .boot-mark i { border-color: #90b4b9; }
      html.boot-dark .boot-mark b { color: #5ee4f2; }
      html.boot-dark .boot-note { color: #8b90a0; }
      #pura-err {
        display: none;
        position: fixed;
        left: 16px; right: 16px; bottom: 16px;
        background: #1a0e10;
        color: #ff8a8a;
        padding: 12px 16px;
        font: 13px/1.4 monospace;
        z-index: 99999;
        white-space: pre-wrap;
        border: 1px solid #5a2020;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-mark"><i></i><span>PURA<b>.</b></span></p>
        <span class="boot-line" aria-hidden="true"></span>
        <p class="boot-note">読み込み中</p>
      </div>
    </div>
    <pre id="pura-err"></pre>
    <script>
      window.__puraIntent = window.__puraIntent || null;
      window.__puraGo = window.__puraGo || function (a) { window.__puraIntent = a; };
      function __puraFail(msg) {
        var el = document.getElementById("pura-err");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(msg || "load error");
      }
      window.addEventListener("error", function (e) {
        var m = e && e.message ? e.message : "";
        if (!m || /ResizeObserver/i.test(m)) return;
        __puraFail(m + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        __puraFail(e && e.reason ? e.reason : "promise error");
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
